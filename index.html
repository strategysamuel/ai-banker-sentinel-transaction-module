<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        const isIgnored = function(msg) {
          if (!msg) return false;
          const str = typeof msg === 'string' ? msg : (msg.message || msg.stack || String(msg));
          return str.includes('MetaMask') ||
                 str.includes('ethereum') ||
                 str.includes('web3') ||
                 str.includes('chrome-extension://') ||
                 str.includes('Failed to connect to MetaMask');
        };

        const originalConsoleError = console.error;
        console.error = function(...args) {
          if (args.some(isIgnored)) {
            return;
          }
          originalConsoleError.apply(console, args);
        };

        const originalConsoleWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(isIgnored)) {
            return;
          }
          originalConsoleWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (isIgnored(event.message) || isIgnored(event.error) || (event.filename && event.filename.includes('chrome-extension://'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnored(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  </head>
